<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="openparking-animated-title">
  <title id="openparking-animated-title">Animated OpenParking mark</title>
  <defs>
    <linearGradient id="opa-panel" x1="22" y1="20" x2="106" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1730"/>
      <stop offset="0.48" stop-color="#0d2550"/>
      <stop offset="1" stop-color="#091021"/>
    </linearGradient>
    <linearGradient id="opa-glow" x1="24" y1="22" x2="105" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#20f4d8"/>
      <stop offset="0.48" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#5b6df7"/>
    </linearGradient>
    <linearGradient id="opa-grid" x1="30" y1="32" x2="100" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="opa-soft-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#22d3ee" flood-opacity="0.22"/>
    </filter>
    <filter id="opa-line-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#2dd4bf" flood-opacity="0.72"/>
    </filter>
    <clipPath id="opa-rounded">
      <rect x="14" y="14" width="100" height="100" rx="24"/>
    </clipPath>
    <style>
      .opa-grid-line {
        animation: opa-grid-drift 7s linear infinite;
        stroke-dasharray: 10 12;
      }

      .opa-main-line {
        animation: opa-breathe 3.4s ease-in-out infinite;
      }

      .opa-pulse-one,
      .opa-pulse-two {
        animation: opa-pulse 2.8s ease-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .opa-pulse-two {
        animation-delay: 1.35s;
      }

      .opa-beacon {
        animation: opa-beacon 1.8s ease-in-out infinite;
      }

      .opa-shine {
        animation: opa-shine 4.2s ease-in-out infinite;
      }

      @keyframes opa-grid-drift {
        to { stroke-dashoffset: -44; }
      }

      @keyframes opa-breathe {
        0%, 100% { opacity: 0.96; }
        50% { opacity: 1; filter: url("#opa-line-glow"); }
      }

      @keyframes opa-pulse {
        0% { opacity: 0.34; transform: scale(0.74); }
        70% { opacity: 0.06; transform: scale(1.34); }
        100% { opacity: 0; transform: scale(1.48); }
      }

      @keyframes opa-beacon {
        0%, 100% { opacity: 0.65; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.28); }
      }

      @keyframes opa-shine {
        0%, 34%, 100% { opacity: 0; transform: translateX(-26px) rotate(18deg); }
        52% { opacity: 0.55; }
        72% { opacity: 0; transform: translateX(42px) rotate(18deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .opa-grid-line,
        .opa-main-line,
        .opa-pulse-one,
        .opa-pulse-two,
        .opa-beacon,
        .opa-shine {
          animation: none;
        }
      }
    </style>
  </defs>

  <rect x="9" y="9" width="110" height="110" rx="28" fill="#07111f" opacity="0.72"/>
  <rect x="14" y="14" width="100" height="100" rx="24" fill="url(#opa-panel)" stroke="#1e3a5f" stroke-width="1.5" filter="url(#opa-soft-shadow)"/>
  <g clip-path="url(#opa-rounded)">
    <circle cx="82" cy="37" r="52" fill="#22d3ee" opacity="0.18"/>
    <circle cx="40" cy="91" r="42" fill="#2563eb" opacity="0.22"/>
    <path class="opa-grid-line" d="M26 47h76M26 68h76M26 89h76M39 28v78M61 28v78M83 28v78" stroke="url(#opa-grid)" stroke-width="1" opacity="0.18"/>
    <path d="M36 89c13-24 31-38 56-43" stroke="#67e8f9" stroke-width="1.4" stroke-linecap="round" opacity="0.28"/>
    <path d="M37 72c18-8 36-11 56-7" stroke="#a7f3d0" stroke-width="1.2" stroke-linecap="round" opacity="0.22"/>
    <rect class="opa-shine" x="54" y="7" width="13" height="118" rx="7" fill="#ffffff" opacity="0"/>
  </g>

  <circle class="opa-pulse-one" cx="76" cy="51" r="29" fill="none" stroke="#7dd3fc" stroke-width="1.8"/>
  <circle class="opa-pulse-two" cx="76" cy="51" r="20" fill="none" stroke="#5eead4" stroke-width="1.5"/>
  <circle cx="76" cy="51" r="16" fill="none" stroke="#5eead4" stroke-width="1.4" opacity="0.45"/>
  <path d="M76 31v9M76 62v9M56 51h9M87 51h9" stroke="#bae6fd" stroke-width="2" stroke-linecap="round" opacity="0.46"/>

  <path
    class="opa-main-line"
    d="M45 93V46c0-14 11-24 26-24h9c18 0 31 12 31 29S98 80 80 80H62c-10 0-17 7-17 16"
    fill="none"
    stroke="url(#opa-glow)"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#opa-line-glow)"
  />
  <path
    d="M63 58h17c5 0 9-3 9-8s-4-8-9-8H63v16Z"
    fill="#08111f"
    stroke="#99f6e4"
    stroke-width="4"
    stroke-linejoin="round"
    opacity="0.94"
  />
  <path class="opa-main-line" d="M78 80l14 29 14-29" fill="none" stroke="url(#opa-glow)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#opa-line-glow)"/>
  <path d="M43 94l17-17" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" opacity="0.84"/>

  <circle class="opa-beacon" cx="39" cy="72" r="3" fill="#bfdbfe"/>
  <circle class="opa-beacon" cx="95" cy="36" r="2.6" fill="#ecfeff"/>
  <circle class="opa-beacon" cx="92" cy="109" r="2.7" fill="#ccfbf1"/>
</svg>
